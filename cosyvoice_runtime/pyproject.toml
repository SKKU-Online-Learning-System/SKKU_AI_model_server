[project]
name = "skku-cosyvoice-runtime"
version = "0.1.0"
description = "Isolated streaming CosyVoice TTS runtime"
requires-python = ">=3.10,<3.11"
dependencies = [
  "conformer==0.3.2",
  "deepspeed==0.15.1",
  "diffusers==0.29.0",
  "fastapi==0.115.6",
  "gdown==5.2.0",
  "hyperpyyaml==1.2.3",
  "hydra-core==1.3.2",
  "inflect==7.3.1",
  "librosa==0.10.2",
  "lightning==2.2.4",
  "matplotlib==3.7.5",
  "modelscope==1.20.0",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "onnxruntime-gpu==1.18.0",
  "openai-whisper==20231117",
  "pyarrow==18.1.0",
  "pyworld==0.3.4",
  "rich==13.7.1",
  "setuptools==80.9.0",
  "soundfile==0.12.1",
  "torch==2.3.1",
  "torchaudio==2.3.1",
  "transformers==4.51.3",
  "uvicorn[standard]==0.30.0",
  "wget==3.2",
  "wetext==0.0.4",
  "x-transformers==2.11.24",
]

[tool.uv]
extra-build-dependencies = { openai-whisper = ["setuptools==80.9.0"] }

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
# Default PyPI onnxruntime-gpu 1.18.0 is a CUDA 11 build and fails to load
# libcublasLt.so.11 here, silently falling back to CPU. 1.19+ needs cuDNN 9,
# which conflicts with torch 2.3.1 (cuDNN 8), so pin the CUDA 12 build of 1.18.0.
onnxruntime-gpu = { index = "onnxruntime-cu12" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "onnxruntime-cu12"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/"
explicit = true
