name: skku-ai-model-server

x-common: &common
  restart: unless-stopped
  gpus: all
  shm_size: ${SHM_SIZE:-32gb}
  volumes:
    - ${HF_HOME:-/models/huggingface}:${HF_HOME:-/models/huggingface}
  env_file:
    - .env

services:
  text-llm:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile.llm
      args:
        BASE_IMAGE: ${BASE_IMAGE:-runpod/pytorch:1.1.0-cu1281-torch280-ubuntu2404-cluster}
    command: ["/app/scripts/start_text_llm.sh"]
    environment:
      CUDA_VISIBLE_DEVICES: ${TEXT_GPU_IDS:-0,1,2,3}
    ports:
      - "${TEXT_PORT:-8001}:${TEXT_PORT:-8001}"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os,urllib.request; r=urllib.request.Request(\"http://127.0.0.1:${TEXT_PORT:-8001}/v1/models\"); k=os.getenv(\"MODEL_SERVER_API_KEY\",\"\"); r.add_header(\"Authorization\",f\"Bearer {k}\") if k else None; urllib.request.urlopen(r,timeout=5).read()'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  voice-llm:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile.llm
      args:
        BASE_IMAGE: ${BASE_IMAGE:-runpod/pytorch:1.1.0-cu1281-torch280-ubuntu2404-cluster}
    command: ["/app/scripts/start_voice_llm.sh"]
    environment:
      CUDA_VISIBLE_DEVICES: ${VOICE_GPU_IDS:-4}
    ports:
      - "${VOICE_PORT:-8002}:${VOICE_PORT:-8002}"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os,urllib.request; r=urllib.request.Request(\"http://127.0.0.1:${VOICE_PORT:-8002}/v1/models\"); k=os.getenv(\"MODEL_SERVER_API_KEY\",\"\"); r.add_header(\"Authorization\",f\"Bearer {k}\") if k else None; urllib.request.urlopen(r,timeout=5).read()'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  speech:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile.speech
      args:
        BASE_IMAGE: ${BASE_IMAGE:-runpod/pytorch:1.1.0-cu1281-torch280-ubuntu2404-cluster}
    environment:
      CUDA_VISIBLE_DEVICES: ${SPEECH_GPU_ID:-5}
    ports:
      - "${SPEECH_PORT:-8010}:${SPEECH_PORT:-8010}"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os,urllib.request,json; r=urllib.request.Request(\"http://127.0.0.1:${SPEECH_PORT:-8010}/health\"); k=os.getenv(\"MODEL_SERVER_API_KEY\",\"\"); r.add_header(\"Authorization\",f\"Bearer {k}\") if k else None; d=json.load(urllib.request.urlopen(r,timeout=5)); assert d[\"ready\"] is True'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s
